[project]
name = "flowpay-teaching"
version = "0.1.0"
description = "Traceable runtime for the FlowPay RAG course"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "psycopg[binary,pool]>=3.2,<4",
  "sqlalchemy>=2,<3",
  "alembic>=1.14,<2",
  "openai>=2,<3",
  "pyyaml>=6,<7",
  "pydantic>=2,<3",
  "typing-extensions>=4.12,<5",
]

[project.scripts]
flowpay = "flowpay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpay"]

[dependency-groups]
dev = [
    "basedpyright>=1.38,<2",
    "httpx2>=2.12,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
